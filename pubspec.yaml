name: danlite_elm
description: OBD Danlite – Professional OBD2 Vehicle Diagnostics for Android & iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  lottie: ^3.1.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.6

  # Real app version/build number for the About, Settings and Account screens,
  # read through lib/services/app_version_service.dart.
  #
  # PINNED TO 8.x DELIBERATELY — DO NOT BUMP TO 9.x/10.x CASUALLY.
  # 8.3.1 declares ext.kotlin_version '1.7.22', so it compiles against this
  # project's Kotlin 1.8.22 pin as-is. package_info_plus 9.0.0 raised its
  # Android floor to Kotlin 2.2.0 + AGP >=8.12.1 + Gradle wrapper >=8.13
  # (see its 9.0.0 changelog). Adopting 9.x/10.x therefore means a three-way
  # toolchain bump, not a dependency bump, and this app's release build is
  # sensitive to that surface (minifyEnabled false / shrinkResources false are
  # load-bearing for com.danlite.elm.BluetoothSppPlugin). An earlier attempt
  # died at :package_info_plus:compileReleaseKotlin for exactly this reason.
  package_info_plus: ^8.3.1

  # ── Backend auth (Phase 2) ─────────────────────────────────────────────────
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.1
  device_info_plus: ^10.1.2

  # ── Entitlement token verification (Phase 3) ───────────────────────────────
  # Ed25519 signature verification only. The app never signs anything and never
  # holds a private key — it verifies tokens minted by the /entitlement Edge
  # Function against the public key in lib/constants/entitlement_public_key.dart.
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/dtc_translations.json
    # Supabase URL + anon key. Gitignored; see .env.example.
    - .env
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/logo.png"
  # Adaptive icons let the Android launcher mask the icon to the device shape
  # (circle on most launchers). White background fills the logo's transparency
  # so the circular crop stays clean, and the wordmark is not hard-chopped.
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
