name: danlite_elm
description: OBD Danlite – Professional OBD2 Vehicle Diagnostics for Android & iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  lottie: ^3.1.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.6

  # Real app version/build number for the About, Settings and Account screens,
  # read through lib/services/app_version_service.dart.
  #
  # PINNED TO 8.x DELIBERATELY — DO NOT BUMP TO 9.x/10.x CASUALLY.
  # 8.3.1 declares ext.kotlin_version '1.7.22', so it compiles against this
  # project's Kotlin 1.8.22 pin as-is. package_info_plus 9.0.0 raised its
  # Android floor to Kotlin 2.2.0 + AGP >=8.12.1 + Gradle wrapper >=8.13
  # (see its 9.0.0 changelog). Adopting 9.x/10.x therefore means a three-way
  # toolchain bump, not a dependency bump, and this app's release build is
  # sensitive to that surface (minifyEnabled false / shrinkResources false are
  # load-bearing for com.danlite.elm.BluetoothSppPlugin). An earlier attempt
  # died at :package_info_plus:compileReleaseKotlin for exactly this reason.
  package_info_plus: ^8.3.1

  # ── Backend auth (Phase 2) ─────────────────────────────────────────────────
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.1
  device_info_plus: ^10.1.2

  # ── Entitlement token verification (Phase 3) ───────────────────────────────
  # Ed25519 signature verification only. The app never signs anything and never
  # holds a private key — it verifies tokens minted by the /entitlement Edge
  # Function against the public key in lib/constants/entitlement_public_key.dart.
  cryptography: ^2.7.0

  # ── Crash/error reporting (Phase 9) ────────────────────────────────────────
  #
  # EXACT PIN, DELIBERATELY — same reasoning as package_info_plus above.
  # Cleared against this project's Android pins before adoption, from the
  # package's own android/build.gradle rather than from assumption:
  #   sentry_flutter 9.27.0 declares ext.kotlin_version '1.8.0' and AGP 7.4.2 —
  #   both BELOW this project's Kotlin 1.8.22 / AGP 8.9.1 / Gradle 8.11.1, so it
  #   compiles against them as-is. Zero toolchain bump required.
  #
  # It does pin `jni: 0.14.2` exactly, which drags path_provider_android back
  # from 2.3.1 to 2.2.23 and drops jni_flutter. That is a downgrade, but a
  # conservative one: on Android path_provider_android serves only google_fonts'
  # font cache (not auth, not secure storage), and 2.2.23 uses the plain
  # platform-channel implementation instead of the newer JNI binding — so the
  # native surface shrinks. Verified by a full `flutter build apk --release`.
  sentry_flutter: 9.27.0

  # ── Fault knowledge store and scan history (fault Phase 1B) ────────────────
  # Raw SQL, no code generation. Only SQL that Android 5's SQLite 3.8 knows is
  # used (lib/knowledge/kb_schema.dart). Pure-Java Android plugin: no Kotlin or
  # AGP floor; the debug APK was built with it before any code used it.
  sqflite: ^2.4.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

  # Used ONLY by tool/make_adaptive_foreground.dart, which derives the adaptive
  # icon foreground from the brand art. Pinned to the exact version
  # flutter_launcher_icons 0.13.1 already resolves transitively, so this adds a
  # direct marker and nothing else to the resolution (verified against
  # pubspec.lock). Dev-only: it is never bundled into the APK.
  image: 4.8.0

  # Host-side SQLite for the knowledge-store tests only (flutter test runs on
  # the desktop VM, where the Android plugin does not exist). Never bundled.
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/dtc_translations.json
    # Bundled baseline knowledge pack (fault Phase 1B). Trusted because the
    # signed APK carries it; see lib/knowledge/knowledge_service.dart.
    - assets/knowledge/generic_en/
    # Supabase URL + anon key. Gitignored; see .env.example.
    - .env
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false

  # Legacy square launcher icon (Android 7 and below, and any launcher that
  # ignores adaptive icons). The brand art carries its own flat WHITE ground
  # and is fully opaque, so it is used here exactly as supplied — no masking is
  # applied at this layer, which is what this flattened art expects.
  #
  # Note the file is a progressive JPEG carrying a .png name. Every consumer
  # here sniffs the content rather than the extension (Android's BitmapFactory,
  # Flutter's Image.asset, and the `image` package's decodeImage), so this is
  # cosmetic — but tool/make_adaptive_foreground.dart had to move off
  # decodePng, which is extension-shaped and returned null for it.
  image_path: "assets/images/logo.png"

  min_sdk_android: 21

  # ── Adaptive icon (Android 8+) ───────────────────────────────────────────
  #
  # The launcher masks the FOREGROUND layer to whatever shape the device wants
  # and only guarantees the central 66/108dp circle survives. assets/images/
  # logo.png cannot serve as that foreground: its artwork spans 99.8% of the
  # image width, so the outer thirds of the engine silhouette would be sheared
  # off at any mask shape, and its ground is an opaque white rectangle that
  # would be visibly clipped into a square-cornered slab.
  #
  # So the foreground is a DERIVED asset: the same artwork lifted off its white
  # ground and rescaled so that 100% of its ink sits inside the 66/108dp safe
  # circle (measured, not assumed — the tool prints the figure). It is crop +
  # scale + pad only, nothing is redrawn. The ground the art was designed
  # against is reproduced by the background layer below, so the launcher
  # composites back to the intended look at any mask shape.
  # Regenerate it with tool/make_adaptive_foreground.dart if the brand art
  # changes.
  adaptive_icon_foreground: "assets/launcher/logo_adaptive_foreground.png"

  # WHITE, because that is the ground this art was drawn on — the same rule the
  # navy #0C0F1D followed for the previous, navy-plated art. This is not a
  # style preference: the DANLITE wordmark is measured at rgb(0,66,143), which
  # against the old #0C0F1D plate is a contrast ratio of 1.7:1 and effectively
  # invisible. Against white it is 10.9:1.
  #
  # The navy brand plate has not gone away — it moved to @color/brand_plate in
  # android/app/src/main/res/values/brand_colors.xml, which is what the boot
  # window and the API 31+ splash background still use. Keeping it out of
  # colors.xml matters because flutter_launcher_icons rewrites that file.
  adaptive_icon_background: "#FFFFFF"
